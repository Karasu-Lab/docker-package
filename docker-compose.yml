name: karasu256

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: karasu256
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d karasu256']
      interval: 2s
      timeout: 5s
      retries: 30

  db-migrate:
    build:
      context: ./db-migrate
      network: host
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/karasu256
    volumes:
      - ../../apps/accounts.karasu256.com/drizzle/migrations:/migrations/accounts:ro
      - ../../apps/qr.karasu256.com/drizzle/migrations:/migrations/qr:ro
    depends_on:
      db:
        condition: service_healthy

  auth:
    build:
      context: ./neon-auth
      network: host
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/neon_auth
      BETTER_AUTH_URL: http://localhost:3010
      BETTER_AUTH_SECRET: local-neon-auth-secret-not-for-production
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3004
    ports:
      - '3010:3010'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3010/neondb/auth/ok').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  firebase:
    build:
      context: ./firebase
      network: host
    ports:
      - '9099:9099'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:9099/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  storage:
    image: chrislusf/seaweedfs:4.52
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - '8333:8333'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8333/']
      interval: 2s
      timeout: 5s
      retries: 60

  storage-init:
    image: chrislusf/seaweedfs:4.52
    entrypoint: ['sh', '-c', "echo 's3.bucket.create -name cdn-local' | weed shell -master=storage:9333"]
    depends_on:
      storage:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
